<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Happy Birthday, Mayo 💛</title>
<meta name="description" content="A little birthday surprise for Mayuri." />

<!--
  ─────────────────────────────────────────────────────────────
  HOW TO PERSONALISE
  ─────────────────────────────────────────────────────────────
  • MESSAGES + PHOTO ORDER  →  edit  messages.json
        [ {"filename.jpg": "message for this moment"}, ... ]
        Year number = position in the list (1st entry = Year 1).
        Filenames are looked up inside photos/web/ (see CONFIG.photoDir).
  • MUSIC  →  edit CONFIG.music.src below. Paste EITHER a YouTube link
        OR a direct audio URL (.mp3/.m4a/.ogg). Leave "" for no music.
  • START / END WORDS  →  edit CONFIG.hero and CONFIG.finale below.
  Note: because messages.json is loaded over the network, open the page
  through a web server or GitHub Pages (not a file:// double-click).
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --blush:#ffd9e4; --peach:#ffe6cf; --lav:#e9dcff; --cream:#fff7ef;
    --rose:#e8608a; --rose-deep:#c9436e; --gold:#d9a441;
    --ink:#5a3a44; --ink-soft:#8a6b74;
    --shadow:rgba(120,60,80,.18); --card:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 700px at 80% -10%, var(--lav) 0%, transparent 55%),
      radial-gradient(1000px 700px at 0% 20%, var(--blush) 0%, transparent 55%),
      linear-gradient(160deg, var(--cream) 0%, var(--peach) 45%, var(--blush) 100%);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }

  #fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20;}

  /* balloons — only shown on start/end slides */
  .balloons{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:2; opacity:0; transition:opacity .7s ease;}
  body.celebrate .balloons{opacity:1;}
  .balloon{position:absolute; bottom:-160px; width:52px; height:66px;
    border-radius:50% 50% 50% 50%/47% 47% 53% 53%; opacity:.9;
    animation:rise linear infinite; filter:drop-shadow(0 6px 8px rgba(0,0,0,.08));}
  .balloon::before{content:""; position:absolute; top:12%; left:22%; width:26%; height:34%; background:rgba(255,255,255,.55); border-radius:50%; filter:blur(1px);}
  .balloon::after{content:""; position:absolute; bottom:-56px; left:50%; width:1px; height:56px; background:linear-gradient(rgba(0,0,0,.25), transparent); transform:translateX(-50%);}
  @keyframes rise{0%{transform:translateY(0) translateX(0) rotate(-4deg);}50%{transform:translateY(-55vh) translateX(22px) rotate(4deg);}100%{transform:translateY(-118vh) translateX(-10px) rotate(-3deg);}}

  /* entry gate */
  #enter{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer;
    background:radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,.35), transparent 60%), linear-gradient(160deg, var(--cream), var(--blush));
    transition:opacity .9s ease, visibility .9s ease; padding:24px;}
  #enter.gone{opacity:0; visibility:hidden;}
  #enter .kicker{font-size:clamp(13px,3.5vw,16px); letter-spacing:.35em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;}
  #enter .to{font-family:'Great Vibes',cursive; font-size:clamp(64px,20vw,140px); line-height:.9; color:var(--rose-deep); text-shadow:0 4px 20px var(--shadow);}
  #enter .heartbeat{font-size:clamp(34px,9vw,54px); margin:6px 0 26px; animation:beat 1.4s ease-in-out infinite;}
  #enter .tap{font-size:clamp(14px,4vw,17px); color:var(--ink); padding:12px 26px; border:1.5px solid rgba(200,120,140,.5); border-radius:999px; background:rgba(255,255,255,.5); backdrop-filter:blur(4px); animation:pulse 2.2s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1);}25%{transform:scale(1.18);}40%{transform:scale(1);}55%{transform:scale(1.1);}}
  @keyframes pulse{0%,100%{transform:translateY(0); opacity:.85;}50%{transform:translateY(-4px); opacity:1;}}

  /* carousel */
  #carousel{position:fixed; inset:0; overflow:hidden; z-index:10; opacity:0; transition:opacity 1s ease .1s; touch-action:pan-y;}
  #carousel.show{opacity:1;}
  .track{display:flex; height:100%; will-change:transform;}
  .slide{flex:0 0 100%; width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 26px);}

  /* start (hero) + end slides */
  .center{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; max-width:min(760px,92vw); height:100%;}
  .kicker{font-size:clamp(12px,3.4vw,15px); letter-spacing:.32em; text-transform:uppercase; color:var(--ink-soft);}
  .age{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(120px,40vw,240px); line-height:.82; margin:4px 0 0;
    background:linear-gradient(160deg, var(--rose), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 10px 40px var(--shadow); letter-spacing:-.02em;}
  .name{font-family:'Great Vibes',cursive; font-size:clamp(58px,18vw,128px); color:var(--rose-deep); line-height:.9; margin:0 0 12px;}
  .tagline{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(19px,5vw,30px); color:var(--ink); margin:0; line-height:1.4;}
  .swipe{margin-top:30px; font-size:clamp(13px,3.6vw,15px); color:var(--ink-soft); letter-spacing:.05em; animation:nudge 2s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateX(0); opacity:.7;}50%{transform:translateX(8px); opacity:1;}}

  .end-line{font-family:'Great Vibes',cursive; font-size:clamp(44px,13vw,84px); color:var(--rose-deep); line-height:1; margin:6px 0 18px;}
  .end-msg{font-size:clamp(16px,4.4vw,20px); line-height:1.8; color:var(--ink); font-weight:300; max-width:600px;}
  .sign{font-family:'Great Vibes',cursive; font-size:clamp(32px,9vw,50px); color:var(--rose); margin-top:16px;}

  /* gift on the end slide */
  .gift{position:relative; width:132px; height:118px; cursor:pointer; outline:none; transition:transform .3s ease; margin-bottom:6px;}
  .gift:hover{transform:translateY(-4px) scale(1.03);} .gift:active{transform:scale(.97);}
  .gift .box{position:absolute; bottom:0; width:132px; height:84px; border-radius:10px; background:linear-gradient(160deg,var(--rose),var(--rose-deep)); box-shadow:0 16px 30px -16px var(--shadow);}
  .gift .box::before{content:""; position:absolute; left:50%; top:0; width:24px; height:100%; transform:translateX(-50%); background:linear-gradient(var(--gold),#f0c96b);}
  .gift .lid{position:absolute; top:18px; left:-6px; width:144px; height:30px; border-radius:8px; background:linear-gradient(160deg,var(--rose-deep),var(--rose)); box-shadow:0 8px 18px -8px var(--shadow); transition:transform .6s cubic-bezier(.2,1.3,.4,1), opacity .6s ease;}
  .gift .lid::before{content:""; position:absolute; left:50%; top:0; width:24px; height:100%; transform:translateX(-50%); background:linear-gradient(var(--gold),#f0c96b);}
  .gift .bow{position:absolute; top:2px; left:50%; transform:translateX(-50%); width:52px; height:24px; transition:transform .5s ease, opacity .5s ease;}
  .gift .bow::before,.gift .bow::after{content:""; position:absolute; top:0; width:26px; height:24px; background:var(--gold); border-radius:50% 50% 50% 50%/60% 60% 40% 40%;}
  .gift .bow::before{left:0; transform:rotate(-18deg);} .gift .bow::after{right:0; transform:rotate(18deg);}
  .gift.open .lid{transform:translateY(-40px) rotate(-12deg); opacity:0;}
  .gift.open .bow{transform:translateX(-50%) translateY(-44px) rotate(-14deg); opacity:0;}
  .gift-hint{color:var(--ink-soft); font-size:14px; margin-top:6px; transition:opacity .4s ease;}
  .end-reveal{max-height:0; opacity:0; overflow:hidden; transform:translateY(12px); transition:max-height .8s ease, opacity .8s ease .15s, transform .8s ease .15s;}
  .end-reveal.open{max-height:70vh; opacity:1; transform:none;}

  /* moment slide */
  .moment{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(10px,2.2vh,18px); max-width:min(720px,94vw); height:100%;}
  .year{flex:0 0 auto; font-family:'Cormorant Garamond',serif; font-size:clamp(20px,5.5vw,30px); color:var(--ink-soft); letter-spacing:.04em;}
  .year b{color:var(--rose-deep); font-weight:600; font-size:clamp(30px,8vw,46px); background:linear-gradient(160deg,var(--rose),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .photo{flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center;}
  .photo img{max-width:100%; max-height:100%; width:auto; height:auto; display:block; background:#fff; padding:clamp(6px,1.6vw,10px); border-radius:12px; box-shadow:0 22px 50px -26px var(--shadow); animation:pop .6s ease both;}
  @keyframes pop{from{opacity:0; transform:scale(.96);}to{opacity:1; transform:none;}}
  .msg{flex:0 0 auto; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(17px,4.8vw,24px); line-height:1.45; color:var(--ink); max-width:620px; text-align:center;}

  /* nav + hud */
  .nav{position:absolute; top:50%; transform:translateY(-50%); z-index:30; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.7); backdrop-filter:blur(6px); color:var(--rose-deep); font-size:26px; line-height:44px; box-shadow:0 10px 24px -12px var(--shadow); transition:transform .2s ease, opacity .3s ease;}
  .nav:hover{transform:translateY(-50%) scale(1.08);} .nav:active{transform:translateY(-50%) scale(.94);}
  .nav.prev{left:12px;} .nav.next{right:12px;}
  .nav[disabled]{opacity:0; pointer-events:none;}
  .counter{position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:50%; transform:translateX(-50%); z-index:30; font-size:13px; letter-spacing:.14em; color:var(--ink-soft); background:rgba(255,255,255,.55); padding:5px 12px; border-radius:999px; backdrop-filter:blur(6px); opacity:0; transition:opacity .3s ease;}
  .counter.show{opacity:1;}
  .progress{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(200,120,140,.18); z-index:30;}
  .progress span{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--rose),var(--gold)); transition:width .5s ease;}

  #music-btn{position:fixed; right:14px; bottom:16px; z-index:45; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.8); backdrop-filter:blur(6px); box-shadow:0 10px 24px -10px var(--shadow); font-size:19px; line-height:46px; transition:transform .2s ease; display:none;}
  #music-btn:hover{transform:scale(1.08);} #music-btn:active{transform:scale(.94);}

  #ytwrap{position:fixed; left:-9999px; top:0; width:320px; height:180px; pointer-events:none;}

  #loading{position:fixed; inset:0; z-index:35; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:20px;}

  /* passcode lock */
  #lock{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
    background:radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,.4), transparent 60%), linear-gradient(160deg, var(--cream), var(--lav));
    transition:opacity .7s ease, visibility .7s ease;}
  #lock.gone{opacity:0; visibility:hidden;}
  .lock-card{max-width:380px; width:100%;}
  .lock-emoji{font-size:44px; margin-bottom:10px;}
  .lock-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(28px,8vw,42px); color:var(--rose-deep); margin:0 0 8px;}
  .lock-sub{color:var(--ink); margin:0 0 22px; font-size:clamp(14px,4vw,16px);}
  #lockForm{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  #lockInput{flex:1 1 180px; min-width:0; padding:13px 18px; border-radius:999px; border:1.5px solid rgba(200,120,140,.5); background:rgba(255,255,255,.85); font-size:16px; color:var(--ink); text-align:center; outline:none; font-family:inherit;}
  #lockInput:focus{border-color:var(--rose);}
  #lockBtn{padding:13px 26px; border:none; border-radius:999px; background:linear-gradient(150deg,var(--rose),var(--rose-deep)); color:#fff; font-size:15px; font-weight:500; cursor:pointer; box-shadow:0 10px 22px -10px var(--shadow); font-family:inherit;}
  #lockBtn:active{transform:scale(.96);}
  .lock-hint{color:var(--ink-soft); font-size:13px; margin-top:16px; min-height:1.2em;}
  #lock.err .lock-card{animation:shake .45s;}
  #lock.err #lockInput{border-color:#d3455f;}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-9px);}40%,60%{transform:translateX(9px);}}

  @media (prefers-reduced-motion: reduce){
    .balloon{display:none;} #enter .heartbeat,#enter .tap,.swipe,.photo img{animation:none;}
    .track{transition:none;}
  }
</style>
</head>
<body>

  <canvas id="fx"></canvas>
  <div class="balloons" id="balloons" aria-hidden="true"></div>

  <div id="lock" role="dialog" aria-label="Passcode required">
    <div class="lock-card">
      <div class="lock-emoji">🔒</div>
      <h1 class="lock-title">A surprise is waiting</h1>
      <p class="lock-sub">Enter the passcode to unlock 💛</p>
      <form id="lockForm">
        <input id="lockInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="passcode" aria-label="Passcode" />
        <button type="submit" id="lockBtn">Unlock</button>
      </form>
      <p class="lock-hint" id="lockHint"></p>
    </div>
  </div>

  <div id="enter" role="button" tabindex="0" aria-label="Tap to begin">
    <div class="kicker">A little surprise</div>
    <div class="to">for Mayo</div>
    <div class="heartbeat">💛</div>
    <div class="tap">Tap anywhere to begin</div>
  </div>

  <section id="carousel" aria-label="Birthday carousel" aria-roledescription="carousel">
    <div class="track" id="track"></div>
    <div id="loading">setting up your surprise…</div>
    <button class="nav prev" id="prev" aria-label="Previous">‹</button>
    <button class="nav next" id="next" aria-label="Next">›</button>
    <div class="progress"><span id="bar"></span></div>
  </section>

  <div id="ytwrap"><div id="yt"></div></div>
  <button id="music-btn" aria-label="Toggle music" title="Music">🔊</button>
  <audio id="audio" loop preload="auto"></audio>

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  nickname: "Mayo",
  photoDir: "photos/web/",       // where the (optimised) photos live

  // ── PASSCODE LOCK ──────────────────────────────────────────
  lock: {
    enabled: true,
    title: "A surprise is waiting",
    sub: "Enter the passcode to unlock 💛",
    placeholder: "passcode",
    hint: "(it'll come to you at the right time)",
    // SHA-256 of the passcode, lowercased & trimmed.  TEMP passcode = "happy31"
    // To change: printf '%s' 'yourcode' | shasum -a 256   → paste the hash here
    hashHex: "0526fdd47407c7fdeae7e3cb2c6bedb49d79485c6c2d7d044a4526ea16e454e2",
    // Optional backup: auto-unlock at this local time even without the code.
    // e.g. "2026-09-23T00:00:00"  (empty = passcode only)
    unlockAt: "",
  },

  // ── MUSIC ──────────────────────────────────────────────────
  // Paste a YouTube link OR a direct audio URL (.mp3/.m4a/.ogg).
  // Leave src "" to turn music off.
  music: {
    src: "https://www.youtube.com/watch?v=yKNxeF4KMsY",  // YouTube link OR direct audio URL
    volume: 0.5,                 // 0–1
    startSeconds: 0,             // YouTube only: start offset
  },

  // ── START SLIDE (no photo) ─────────────────────────────────
  hero: {
    kicker: "Happy Birthday",
    age: "31",
    name: "Mayuri",
    tagline: "31 moments to cherish — one for every year of your life",
    swipe: "swipe to begin →",
  },

  // ── END SLIDE (no photo) ───────────────────────────────────
  finale: {
    kicker: "One more thing",
    hint: "tap the gift 🎁",
    line: "I love you, Mayo",
    message: "Thirty-one moments, and a lifetime still to go. Thank you for being my favourite person, my home, my every good day. Happy 31st birthday, my love — here's to us.",
    from: "Akshay",
  },
};

/* ══════════════════════════════════════════════════════════════
   Build slides (hero + moments from messages.json + finale)
   ══════════════════════════════════════════════════════════════ */
const track = document.getElementById('track');
const slides = [];        // slide DOM elements
let FIRST_MOMENT = 1;     // index of first moment slide
let LAST_INDEX = 0;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function resolveSrc(file){ return /^(https?:)?\/\//.test(file) || file.startsWith('/') ? file : CONFIG.photoDir + file; }

function heroSlide(){
  const h = CONFIG.hero;
  const el = document.createElement('article'); el.className = 'slide';
  el.innerHTML =
    '<div class="center">' +
      '<div class="kicker">' + esc(h.kicker) + '</div>' +
      '<div class="age">' + esc(h.age) + '</div>' +
      '<div class="name">' + esc(h.name) + '</div>' +
      '<p class="tagline">' + esc(h.tagline) + '</p>' +
      '<div class="swipe">' + esc(h.swipe) + '</div>' +
    '</div>';
  return el;
}

function momentSlide(file, message, year){
  const el = document.createElement('article'); el.className = 'slide';
  el.innerHTML =
    '<div class="moment">' +
      '<div class="year">Year <b>' + year + '</b></div>' +
      '<div class="photo"><img alt="Year ' + year + '" data-src="' + esc(resolveSrc(file)) + '"></div>' +
      '<p class="msg">' + esc(message) + '</p>' +
    '</div>';
  return el;
}

function finaleSlide(){
  const f = CONFIG.finale;
  const el = document.createElement('article'); el.className = 'slide';
  el.innerHTML =
    '<div class="center">' +
      '<div class="kicker">' + esc(f.kicker) + '</div>' +
      '<div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the gift">' +
        '<div class="box"></div><div class="lid"></div><div class="bow"></div>' +
      '</div>' +
      '<div class="gift-hint" id="giftHint">' + esc(f.hint) + '</div>' +
      '<div class="end-reveal" id="endReveal">' +
        '<div class="end-line">' + esc(f.line) + '</div>' +
        '<p class="end-msg">' + esc(f.message) + '</p>' +
        '<div class="sign">— ' + esc(f.from) + '</div>' +
      '</div>' +
    '</div>';
  return el;
}

async function build(){
  // hero
  track.appendChild(heroSlide());
  // moments
  let moments = [];
  try{
    const res = await fetch('messages.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    moments = await res.json();
  }catch(err){
    console.warn('Could not load messages.json —', err);
    document.getElementById('loading').textContent = 'Could not load messages.json (open via a web server).';
  }
  moments.forEach((entry, i) => {
    const file = Object.keys(entry)[0];
    const message = entry[file];
    track.appendChild(momentSlide(file, message, i + 1));
  });
  // finale
  track.appendChild(finaleSlide());

  // collect
  slides.length = 0;
  document.querySelectorAll('.slide').forEach(s => slides.push(s));
  LAST_INDEX = slides.length - 1;

  document.getElementById('loading').style.display = 'none';
  wireFinale();
  place(false); onChange();
}

/* ══════════════════════════════════════════════════════════════
   Carousel controller
   ══════════════════════════════════════════════════════════════ */
const carousel = document.getElementById('carousel');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const bar = document.getElementById('bar');
let index = 0, W = window.innerWidth;

function measure(){ W = carousel.clientWidth || window.innerWidth; place(false); }
function place(animate){
  track.style.transition = animate ? 'transform .55s cubic-bezier(.4,0,.2,1)' : 'none';
  track.style.transform = 'translateX(' + (-index * W) + 'px)';
}
function loadNear(){
  [index-1, index, index+1].forEach(i => {
    const s = slides[i]; if(!s) return;
    const img = s.querySelector('img[data-src]');
    if(img){ img.src = img.dataset.src; img.removeAttribute('data-src'); }
  });
}
function onChange(){
  loadNear();
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === LAST_INDEX;
  bar.style.width = (LAST_INDEX ? (index / LAST_INDEX) * 100 : 0) + '%';
  // balloons/ambient only on start + end slides
  const celebrate = (index === 0 || index === LAST_INDEX);
  document.body.classList.toggle('celebrate', celebrate);
  ambientOn = celebrate;
  if(index === LAST_INDEX){ setTimeout(() => burst(W*0.5*DPR, H*0.42, 90), 300); }
}
function go(i){ i = Math.max(0, Math.min(LAST_INDEX, i)); if(i===index){ place(true); return; } index = i; place(true); onChange(); }

prevBtn.addEventListener('click', () => go(index-1));
nextBtn.addEventListener('click', () => go(index+1));
addEventListener('keydown', e => {
  if(!carousel.classList.contains('show')) return;
  if(e.key === 'ArrowRight') go(index+1);
  else if(e.key === 'ArrowLeft') go(index-1);
});
addEventListener('resize', measure);

/* pointer drag / swipe */
let dragging=false, startX=0, startY=0, base=0, decided=false, horizontal=false;
carousel.addEventListener('pointerdown', e => {
  if(e.target.closest('.gift')) return;      // let the gift receive its tap
  dragging=true; decided=false; horizontal=false;
  startX=e.clientX; startY=e.clientY; base=-index*W;
  track.style.transition='none';
});
addEventListener('pointermove', e => {
  if(!dragging) return;
  const dx=e.clientX-startX, dy=e.clientY-startY;
  if(!decided && (Math.abs(dx)>6 || Math.abs(dy)>6)){ decided=true; horizontal=Math.abs(dx)>Math.abs(dy); }
  if(horizontal){ e.preventDefault(); track.style.transform='translateX(' + (base+dx) + 'px)'; }
});
function endDrag(e){
  if(!dragging) return; dragging=false;
  if(!horizontal){ place(true); return; }
  const dx=e.clientX-startX, th=Math.min(90, W*0.16);
  if(dx <= -th) go(index+1);
  else if(dx >= th) go(index-1);
  else place(true);
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

/* ══════════════════════════════════════════════════════════════
   Finale gift reveal
   ══════════════════════════════════════════════════════════════ */
function wireFinale(){
  const gift = document.getElementById('gift');
  const hint = document.getElementById('giftHint');
  const reveal = document.getElementById('endReveal');
  if(!gift) return;
  let opened=false;
  const open = () => {
    if(opened) return; opened=true;
    gift.classList.add('open'); hint.style.opacity='0'; reveal.classList.add('open');
    const r = gift.getBoundingClientRect();
    burst((r.left+r.width/2)*DPR, (r.top+r.height/2)*DPR, 150);
    setTimeout(rain, 250);
  };
  gift.addEventListener('click', open);
  gift.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
}

/* ══════════════════════════════════════════════════════════════
   Particle engine — ambient hearts + confetti
   ══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let W2, H, DPR;
function resizeFx(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth*DPR); canvas.height = Math.floor(innerHeight*DPR);
  canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
  W2 = canvas.width; H = canvas.height;
}
resizeFx(); addEventListener('resize', resizeFx);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HEART_COLORS = ['#e8608a','#ef7d9d','#f0a35e','#c79be8','#f2c14e'];
const CONFETTI_COLORS = ['#e8608a','#f0a35e','#c79be8','#7ec6c0','#f2c14e','#ef7d9d','#d9a441','#ffffff'];
let ambient=[], confetti=[], running=false, ambientOn=true;

function drawHeart(x,y,size,rot,color,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(size,size); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(0,.3);
  ctx.bezierCurveTo(0,-.15,-.5,-.15,-.5,.15); ctx.bezierCurveTo(-.5,.5,0,.7,0,1);
  ctx.bezierCurveTo(0,.7,.5,.5,.5,.15); ctx.bezierCurveTo(.5,-.15,0,-.15,0,.3);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function spawnAmbient(){
  ambient.push({x:Math.random()*W2, y:H+40*DPR, vy:(-.25-Math.random()*.35)*DPR, sway:.4+Math.random()*.9, phase:Math.random()*6.28,
    size:(14+Math.random()*16)*DPR, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.01, color:HEART_COLORS[(Math.random()*HEART_COLORS.length)|0], alpha:.3+Math.random()*.35});
}
function burst(x,y,amount){
  amount=amount||90;
  for(let i=0;i<amount;i++){ const a=Math.random()*6.28, sp=(2+Math.random()*7)*DPR;
    confetti.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*DPR,g:(.12+Math.random()*.1)*DPR,w:(5+Math.random()*6)*DPR,h:(8+Math.random()*8)*DPR,
      rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,color:CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],life:1,decay:.006+Math.random()*.006,round:Math.random()<.3}); }
  ensureRunning();
}
function rain(){
  for(let i=0;i<120;i++){ confetti.push({x:Math.random()*W2,y:-Math.random()*H*.4,vx:(Math.random()-.5)*1.5*DPR,vy:(2+Math.random()*3)*DPR,g:.03*DPR,
    w:(5+Math.random()*6)*DPR,h:(8+Math.random()*8)*DPR,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,color:CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],life:1,decay:.004+Math.random()*.003,round:Math.random()<.3}); }
  ensureRunning();
}
let lastSpawn=0;
function frame(t){
  ctx.clearRect(0,0,W2,H);
  if(ambientOn && !reduce){
    if(t-lastSpawn>460){ spawnAmbient(); lastSpawn=t; }
  }
  for(let i=ambient.length-1;i>=0;i--){ const p=ambient[i]; p.phase+=.02; p.y+=p.vy; p.x+=Math.sin(p.phase)*p.sway*DPR; p.rot+=p.vr;
    drawHeart(p.x,p.y,p.size/32,p.rot,p.color,p.alpha); if(p.y<-60*DPR) ambient.splice(i,1); }
  for(let i=confetti.length-1;i>=0;i--){ const c=confetti[i]; c.vy+=c.g; c.x+=c.vx; c.y+=c.vy; c.rot+=c.vr; c.life-=c.decay;
    if(c.life<=0||c.y>H+40*DPR){ confetti.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,c.life); ctx.fillStyle=c.color; ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    if(c.round){ ctx.beginPath(); ctx.arc(0,0,c.w*.5,0,7); ctx.fill(); } else ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore(); }
  if(running) requestAnimationFrame(frame);
}
function ensureRunning(){ if(!running){ running=true; requestAnimationFrame(frame); } }

/* balloons (used on start/end) */
(function balloons(){
  const wrap=document.getElementById('balloons'); const colors=['#e8608a','#f0a35e','#c79be8','#7ec6c0','#f2c14e','#ef7d9d']; const N=7;
  for(let i=0;i<N;i++){ const b=document.createElement('div'); b.className='balloon'; const c=colors[i%colors.length];
    b.style.background='radial-gradient(circle at 32% 28%, #ffffff88, '+c+' 55%)'; b.style.left=(4+i*(92/N)+Math.random()*6)+'vw';
    b.style.animationDuration=(11+Math.random()*8)+'s'; b.style.animationDelay=(-Math.random()*16)+'s';
    b.style.setProperty('transform','scale('+(0.7+Math.random()*0.6)+')'); wrap.appendChild(b); }
})();

/* ══════════════════════════════════════════════════════════════
   Music — YouTube (iframe API) OR direct audio, auto-detected
   ══════════════════════════════════════════════════════════════ */
const musicBtn = document.getElementById('music-btn');
const audio = document.getElementById('audio');
const M = CONFIG.music || {};
let musicCtl = null;

function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
  return null;
}
function fadeAudio(target){ const step=()=>{ if(audio.volume<target-.02){ audio.volume=Math.min(target,audio.volume+.03); requestAnimationFrame(step); } else audio.volume=target; }; step(); }

(function setupMusic(){
  const id = ytId(M.src);
  if(id){
    let player=null, ready=false, wantPlay=false;
    window.onYouTubeIframeAPIReady = function(){
      player = new YT.Player('yt', {
        videoId:id, width:'320', height:'180',
        playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,playsinline:1,loop:1,playlist:id,start:M.startSeconds||0},
        events:{ onReady:()=>{ ready=true; try{ player.setVolume(Math.round((M.volume??.5)*100)); }catch(e){} if(wantPlay) doPlay(); } }
      });
    };
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    const doPlay=()=>{ try{ player.unMute(); player.setVolume(Math.round((M.volume??.5)*100)); player.playVideo(); musicBtn.textContent='🔊'; }catch(e){} };
    musicCtl = {
      start:()=>{ if(ready) doPlay(); else wantPlay=true; },
      toggle:()=>{ if(!ready) return; try{ if(player.getPlayerState()===1){ player.pauseVideo(); musicBtn.textContent='🔇'; } else { player.playVideo(); player.unMute(); musicBtn.textContent='🔊'; } }catch(e){} },
    };
  } else if(M.src){
    audio.src=M.src; audio.volume=0;
    musicCtl = {
      start:()=>{ audio.play().then(()=>fadeAudio(M.volume??.5)).catch(()=>{}); },
      toggle:()=>{ if(audio.paused){ audio.play(); fadeAudio(M.volume??.5); musicBtn.textContent='🔊'; } else { audio.pause(); musicBtn.textContent='🔇'; } },
    };
  }
})();
musicBtn.addEventListener('click', () => musicCtl && musicCtl.toggle());

/* ══════════════════════════════════════════════════════════════
   Passcode lock  (soft client-side gate — good enough for a surprise)
   ══════════════════════════════════════════════════════════════ */
(function initLock(){
  const lock = document.getElementById('lock');
  const L = CONFIG.lock || {};
  const done = () => { lock.style.display = 'none'; };

  if(!L.enabled){ done(); return; }

  // fill copy from config
  document.querySelector('.lock-title').textContent = L.title || 'A surprise is waiting';
  document.querySelector('.lock-sub').textContent = L.sub || '';
  const input = document.getElementById('lockInput');
  const hint = document.getElementById('lockHint');
  input.placeholder = L.placeholder || 'passcode';
  hint.textContent = L.hint || '';

  // backup: auto-unlock once the moment arrives
  if(L.unlockAt){ const t = Date.parse(L.unlockAt); if(!isNaN(t) && Date.now() >= t){ done(); return; } }

  // already unlocked on this device?
  try{ if(localStorage.getItem('mayo_unlocked') === '1'){ done(); return; } }catch(e){}

  async function sha256hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  document.getElementById('lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const val = (input.value || '').trim().toLowerCase();
    if(!val) return;
    let h = null;
    try{ h = await sha256hex(val); }catch(err){ h = null; }
    if(h && h === L.hashHex){
      try{ localStorage.setItem('mayo_unlocked','1'); }catch(e){}
      lock.classList.add('gone');
      setTimeout(() => lock.remove(), 800);
    }else{
      lock.classList.add('err');
      hint.textContent = 'Not quite — try again 💛';
      input.select();
      setTimeout(() => lock.classList.remove('err'), 500);
    }
  });
  setTimeout(() => { try{ input.focus(); }catch(e){} }, 300);
})();

/* ══════════════════════════════════════════════════════════════
   Entry
   ══════════════════════════════════════════════════════════════ */
const enter = document.getElementById('enter');
let entered=false;
function begin(){
  if(entered) return; entered=true;
  enter.classList.add('gone');
  carousel.classList.add('show');
  measure(); onChange(); ensureRunning();
  if(musicCtl){ musicCtl.start(); musicBtn.style.display='block'; }
  setTimeout(() => { burst(W2*0.5, H*0.32, 120); rain(); }, 250);
  setTimeout(() => enter.remove(), 1000);
}
enter.addEventListener('click', begin);
enter.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); begin(); } });

/* go */
build();
</script>
